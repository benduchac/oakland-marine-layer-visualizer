name: Fetch sounding

# Vercel Hobby cron jobs only have +/-59min scheduling precision, which is
# useless for "have fresh data before a pre-dawn bike ride." GitHub Actions
# schedules are tighter in principle, but in practice this workflow's own
# schedule events have fired anywhere from on-time to 6+ hours late (e.g.
# 18:05Z on 2026-09-14) — so the wide sweep here is a hedge against GH's own
# scheduling slop, not the KOAK sounding itself: it's shown up within ~2min
# of 12:00Z the one morning we've timed it closely (balloons for a 12Z
# sounding launch ~11Z, an hour early, per NWS convention). Given GH
# Actions' unreliability, a home-server systemd timer is now the primary
# fetch path — see scripts/systemd/fetch-sounding.timer — and this workflow
# is just the fallback.
on:
  schedule:
    - cron: "15,20,25,30,35,40,45,50,55 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The sweep can't cancel its own later scheduled triggers, so instead
      # each run checks the already-stored record (a cheap read, no upstream
      # archive call) and skips re-fetching once today's 12Z launch is in —
      # avoids hammering the archive for the rest of the window once we have
      # what we came for.
      - name: Check whether today's sounding is already fetched
        id: check
        run: |
          today=$(date -u +%Y-%m-%d)
          response=$(curl -s https://steamer-view.vercel.app/api/sounding || echo '{}')
          launch_date=$(echo "$response" | jq -r '.data.launchTimeUTC // empty' | cut -c1-10)
          if [ "$launch_date" = "$today" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger sounding fetch
        if: steps.check.outputs.fresh != 'true'
        run: curl -sf https://steamer-view.vercel.app/api/cron/fetch-sounding
