name: Fetch sounding

# Vercel Hobby cron jobs only have +/-59min scheduling precision, which is
# useless for "have fresh data before a pre-dawn bike ride." GitHub Actions
# schedules are much tighter, so this sweeps the window where the KOAK 12Z
# sounding tends to post (observed as late as 12:43Z on 2026-09-11) instead
# of relying on Vercel's own cron feature.
on:
  schedule:
    - cron: "15,20,25,30,35,40,45,50,55 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The sweep can't cancel its own later scheduled triggers, so instead
      # each run checks the already-stored record (a cheap read, no upstream
      # archive call) and skips re-fetching once today's 12Z launch is in —
      # avoids hammering the archive for the rest of the window once we have
      # what we came for.
      - name: Check whether today's sounding is already fetched
        id: check
        run: |
          today=$(date -u +%Y-%m-%d)
          response=$(curl -s https://steamer-view.vercel.app/api/sounding || echo '{}')
          launch_date=$(echo "$response" | jq -r '.data.launchTimeUTC // empty' | cut -c1-10)
          if [ "$launch_date" = "$today" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger sounding fetch
        if: steps.check.outputs.fresh != 'true'
        run: curl -sf https://steamer-view.vercel.app/api/cron/fetch-sounding
